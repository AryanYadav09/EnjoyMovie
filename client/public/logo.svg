<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD65B" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Base reel ring -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#161A24" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  <!-- Film perforation dots -->
  <circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.25)" />
  <circle cx="10" cy="38" r="2" fill="rgba(255,255,255,0.25)" />
  <circle cx="38" cy="10" r="2" fill="rgba(255,255,255,0.25)" />
  <circle cx="38" cy="38" r="2" fill="rgba(255,255,255,0.25)" />
  <!-- Center Play/Film Icon -->
  <path d="M20 16L32 24L20 32V16Z" fill="url(#amberGrad)" filter="url(#glow)" />
</svg>
